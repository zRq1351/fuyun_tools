name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM（提供 clang/libclang）
        run: choco install llvm --no-progress -y

      - name: 安装 vcpkg 并集成
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install

      - name: 安装 OpenCV（x64-windows）
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: ${{ runner.temp }}\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 录屏更稳定：达到自动停止条件后，录制收尾更完整，异常中断、音频缺失和临时文件残留的问题进一步减少
            - 截图更好用：全屏截图现已支持多显示器，双屏或多屏环境下可直接截取完整桌面
            - 长截图更可靠：保存、复制到剪贴板和固定到屏幕现已统一走同一套后端导出链路，马赛克、画笔、文字和图形标注结果更一致
            - 长截图编辑更准确：放大或缩小后，马赛克、直线、箭头和文字的预览、落点与最终导出效果进一步对齐
            - 长截图启动更干净：开始采样时的界面切换顺序已优化，小预览不再先闪出上一次内容，首帧误带入鼠标指针的情况进一步减少
            - 标注编辑更流畅：截图页撤销/重做机制重构，连续涂鸦、马赛克、文字和图形编辑时更稳、更省内存
            - 设置保存更可靠：设置项自动保存逻辑优化，快速连续修改时不容易再出现旧结果覆盖新设置
            - 图片历史体验提升：预热与分页加载效率更高，快速滚动、跳到末尾和大历史量场景下响应更顺滑
            - 图片去重更准确：重复图片识别链路优化，降低误判导致图片未入库或预览异常的情况
            - 多窗口同步更一致：图片置顶状态与文本列表选中/定位问题已修复，跨窗口使用时表现更统一
            - 数据状态更干净：文本分类的删除与清空逻辑已对齐，减少分类残留或重启后重新出现的问题
            - 图片历史更稳定：增量列表裁剪与删除失败回滚已补齐，长期开窗、大量历史和异常删除场景下状态更一致
            - 划词更安心：取词后会自动恢复原有剪贴板内容，文本、图片等已复制内容不容易再被意外覆盖
            - 键盘状态更稳：划词取词和自动粘贴链路中的 Ctrl 修饰键释放逻辑已加强，偶发“Ctrl 像一直按着没松开”的情况进一步减少
            - 自动回填更准确：目标窗口识别逻辑优化，包含相似标题关键字的第三方窗口不再容易被误判
            - 数据同步更高效：文本历史、图片历史、分类顺序和置顶顺序的数据库同步链路已统一优化，大批量更新时更稳、更省资源
            - 备份任务更稳：导出备份、恢复备份与自动备份已统一串行化，减少并发执行导致的状态竞争与偶发失败
            - 备份恢复更可靠：恢复失败后的自动回滚链路已加强，回滚失败会返回更明确的组合错误信息，排查更直接
            - 图片合并恢复更完整：合并模式下若图片文件已存在但记录缺失，会自动补齐数据库记录，避免“文件在但列表不显示”
            - 备份文件管理更安全：删除备份时已增加目录边界与后缀校验，仅允许删除备份目录内的 `.fytbk.zip` 文件
            - 备份临时目录更安全：临时目录命名策略已加固，降低并发场景下目录冲突带来的导出/恢复异常风险
          releaseDraft: false
          prerelease: false
