name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 全新录屏能力上线：新增完整录屏模块（状态管理、事件派发、错误码体系、回归自检）
            - 原生音频采集重构：新增 WASAPI 录制链路，支持系统音频输出设备与麦克风设备管理
            - 新增录屏悬浮胶囊：支持快捷键唤起、折叠态控制、录制/暂停/恢复/停止一体化操作
            - 录屏设置能力增强：新增录屏设置面板，支持帧率、码率、光标录制、设备选择等配置
            - 合规与分发完善：补充 FFmpeg 第三方声明及许可证文本（GPLv2/LGPLv2.1）并随包分发
            - 文档体系更新：新增/更新项目 Wiki 与运行构建文档，补齐录屏模块说明
          releaseDraft: false
          prerelease: false
