name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 新增功能级启停：文本剪贴板、图片剪贴板、划词、截图均支持独立启用/停用
            - 停用后端硬停：对应监听与快捷键链路不再静默运行，避免后台无感监听
            - 划词监听升级为可卸载低级 Hook，关闭划词可即时释放监听并支持再次启用
            - 设置中心新增“划词”分栏，划词开关与翻译/解释提示词模板迁移到独立栏位
            - 划词翻译/解释增加 AI 配置校验，未配置时自动打开设置页并定位到 AI 分栏提示完善配置
            - AI 提供商配置放宽：允许不填写 Key 保存设置，支持后续按需补充
            - 截图取色体验增强：新增放大镜预览，Shift 切换 RGB/# 显示，Ctrl 快速复制取色值
            - 截图工具栏图标统一：固定、取消、确认、矩形、圆形使用标准图标库并与整体样式一致
            - 截图标注能力增强：文字、矩形、圆形、直线、箭头支持后续拖动与调整
            - 修复截图导出位置偏移：高 DPI 下文字与图形导出位置与编辑位置保持一致
          releaseDraft: false
          prerelease: false
