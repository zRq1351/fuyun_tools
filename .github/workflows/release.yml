name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 修复 OCR 结果窗口在生产环境偶发白屏、无法双击关闭的问题，重写页面渲染与数据注入兜底逻辑
            - 修复 OCR 结果窗口在生产环境未铺满导致的白色区域问题，改为更稳定的窗口铺满布局方案
            - 修复录制“暂停后仍继续录制”的问题，Windows 下暂停/恢复改为线程级挂起与恢复，状态与实际行为一致
            - 修复胶囊设置窗口点击开始录制后位置跳变的问题，移除历史工具栏尺寸阈值残留并重构为显式布局模式
            - 录制参数行为统一：捕获麦克风与系统音频以胶囊中的设置为准，开始录制时与胶囊设置保持一致
            - 录屏设置体验优化：音频来源改为下拉选择，输出目录改为输入框图标选择并展示完整路径
            - 设置页布局优化：顶部与左侧固定，仅右侧设置项区域滚动，提升长表单编辑体验
            - 剪贴板设置页重构：快捷键与启用项前置，数据管理分组重排并统一按钮风格
            - 图片导入流程优化：单输入框双图标（图片/目录）导入，新增导入前确认与图片总数预估展示
            - 导入状态交互修复：导入进度条不再溢出内容区，导入完成后自动收起并清空输入来源
            - 录制子进程稳定性优化：Windows 下统一隐藏 ffmpeg 命令行窗口，避免录制启动/探测阶段弹出黑框
          releaseDraft: false
          prerelease: false
