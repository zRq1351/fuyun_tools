name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 修复图片历史记录置顶功能异常，提升置顶排序稳定性
            - 优化图片历史项置顶与重排逻辑，减少刷新前后顺序漂移
            - 防止在剪贴板更新与选择处理中触发重复操作，降低回填重复风险
            - 新增回写去重调试能力，便于定位重复写入与链路问题
            - 重构回写链路与设置页结构，提升可维护性与操作一致性
            - 重构核心模块并优化性能，提升整体稳定性
            - 优化剪贴板管理器与图片历史同步流程，强化数据一致性
            - 新增异步预览缓存机制，并优化 Ctrl 键释放相关交互稳定性
          releaseDraft: false
          prerelease: false
