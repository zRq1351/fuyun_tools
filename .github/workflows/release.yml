name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM（提供 clang/libclang）
        run: choco install llvm --no-progress -y

      - name: 安装 vcpkg 并集成
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install

      - name: 安装 OpenCV（x64-windows）
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: ${{ runner.temp }}\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🆕 新增功能

            ### 📂 文档管理器（全新模块）
            - 支持多根目录管理与拖拽导入，自动提取文件元数据
            - 索引/搬迁两种存储模式，适配不同使用场景
            - 分类管理、搜索过滤、排序，快速定位文件
            - **桌面小部件**：常驻桌面，拖拽即导入，极简交互

            ### 🎨 文件类型图标
            - 自动调用系统关联程序图标（GDI 原生提取，最高 256px）
            - 静态缓存 + 批量加载，毫秒级响应，零延迟体验
            - 图标遮罩/透明度完美保留，清晰不模糊

            ### 🌐 国际化（i18n）
            - 完整中英文界面切换（zh-CN / en-US），覆盖全部页面

            ## ✨ 体验优化
            - **窗口拖拽吸附**：手动拖拽 + 20px 边缘吸附，流畅跟手
            - **紧凑通知**：切换为 ElMessage 顶部滑入，极简不打扰
            - **右键菜单优化**：菜单打开时文件列表不折叠；空白处点击自动收起
            - **删除确认弹窗**：二次确认防误删，弹窗期间列表不关闭
            - **文件激活态**：右键选中文件高亮突出显示
            - **刷新按钮**：小部件顶部一键刷新数据
            - **导入模式弹窗**：精简为双按钮，不再显示正文说明

            ## 🔧 问题修复
            - 修复截图窗口 DPI 缩放下尺寸计算偏差
            - 修复拖拽导入 Tauri v2 IPC 字段名反序列化失败
            - 修复剪贴板历史滚动卡顿与图片数据异常
            - 修复录制麦克风时偶发系统音频消失
            - 修复窗口拖拽坐标反馈循环抖动

            ## 🏗 底层改进
            - 数据库工具函数重构，新增错误码体系与前端错误处理
            - 全局主题变量统一，深色/浅色模式完整覆盖
            - 启动器应用图标批量提取，分类管理增强
            - AI 客户端缓存优化，OCR 引擎稳健性提升
            - 备份归档工具，120+ 文件代码质量增强
          releaseDraft: false
          prerelease: false
