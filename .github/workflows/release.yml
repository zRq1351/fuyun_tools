name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - Windows 窗口录制链路升级：窗口模式接入 WGC
            - 修复窗口录制停止后偶发 mp4 无法播放（moov atom not found）问题，重构 WGC 停止与封口时序
            - 区域录制交互重构：录制目标改为全屏/窗口/区域
            - 录屏稳定性增强：异常退出错误新增 关键片段回传
            - 录制中音频即时生效：支持录制过程中动态开关系统音频/麦克风，并保持时间轴连续（静音补齐）
            - 录制中音频设备兜底：开启失败时自动回退默认设备重试
            - WASAPI 兼容性提升：扩展更多采样格式支持（I8/U8/I32/U32/F64），降低“采样格式不支持”失败概率
            - 录制工具栏展开态尺寸调整：展开高度统一优化为 730，提升设置项可视范围并保持窗口宽度稳定
            - 录制设置下拉数据改为实时刷新：目标窗口/系统音频/应用音频/麦克风在面板展开与下拉展开时都会自动刷新
            - 目标窗口展示优化：改为“进程名/应用名 - 窗口标题”格式，定位目标窗口更直观
            - 目标窗口过滤优化：剔除 Windows 11 TextInputHost（输入体验）窗口，减少无效候选项干扰
          releaseDraft: false
          prerelease: false
