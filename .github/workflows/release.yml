name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install frontend dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ runner.os }}-v1
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: 安装 LLVM（提供 clang/libclang）
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: "-Clink-arg=-fuse-ld=lld"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🛡️ 安全修复（v0.8.21 → v0.8.22）

            ### 🔒 CSP 全面修复
            - 修复生产环境截图无法加载：补充 `http://asset.localhost` 到 CSP img-src
            - 修复 IPC 调用被拦截：补充 `http://ipc.localhost` 到 CSP connect-src
            - 统一 CSP 规则覆盖 `asset:`、`http://asset.localhost`、`https://asset.localhost` 三种协议

            ### 📸 截图管线重构
            - **数据源重写**：移除 DOM eval 注入，改用 Tauri IPC + Event 机制
            - **窗口预创建**：截图功能启用时预创建窗口常驻后台，首次截图零延迟
            - **临时目录迁移**：截图引导图片从 exe 目录移至系统临时目录，避免权限问题
            - **长截图修复**：取消长截图后立即清除运行时 slot，不再提示"已有长截图在运行"
            - **遮罩修复**：截图初始 idle 状态也渲染暗色蒙层

            ### 🖼️ 图片加载优化
            - 图片全屏预览优先走资产协议文件路径，base64 作为回退
            - 图片剪贴板缩略图优先走资产协议加载，减少内存占用
            - 拖拽区域修复：启动器搜索清除按钮不再误触发窗口拖拽
            - 特征开关修复：关闭功能时同步销毁对应窗口（截图、剪贴板、录屏等）

            ### 🐛 Bug 修复
            - 剪贴板历史清空同步清理指纹索引
            - 移除历史条目时同步持久化分类和置顶状态
            - 自动备份失败后标志位正确重置
            - 图片持久化队列溢出时不再静默丢弃
            - 窗口可见性标志改为实际显示后再设置
            - 选词工具栏 enterTimeout 鼠标离开时正确清除
            - 分类更新失败时立即清除抑制标志

            ### 🏗️ 架构优化
            - 所有功能窗口统一预创建逻辑（启动+设置联动）
            - 移除过期 BMP/JPEG 编码实验代码
            - 移除 DOM eval 截图数据注入
            - 测试修复：预存 4 个失败测试全部通过
          releaseDraft: false
          prerelease: false
