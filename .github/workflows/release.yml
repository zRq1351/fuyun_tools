name: '发布应用'

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  # 将 OpenCV vcpkg 缓存绑定到默认分支，让 tag release 能跨 ref 命中缓存
  cache-opencv:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Cache vcpkg (OpenCV)
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并编译 OpenCV
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

  publish-tauri:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install frontend dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ runner.os }}-v1
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: 安装 LLVM（提供 clang/libclang）
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: "-Clink-arg=-fuse-ld=lld"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🎥 录屏全链路重构（v0.8.22 → v0.8.23）

            ### 🔧 功能修复（53 项）

            **音频系统**
            - 修复 stop_recording 中 audio_bitrate_kbps 在 reset_to_idle() 后读取导致码率归零
            - 修复多进程音频采集 JoinHandle 泄漏（仅保留第一个，其余 N-1 个脱管）
            - 修复 stop_recording 音频线程无超时 join() 导致潜在死锁
            - 修复 resume_recording 先生成线程再校验状态，状态变更时线程泄漏
            - 修复 pause_recording 中间态暴露 Stopping 导致 stop_recording 被拒绝
            - 修复确保音频捕获启动时提前返回跳过 enabled_flag 初始化
            - 修复 AAC 重编码重试失败时 merged_path 临时文件泄漏
            - 修复暂停时 kill FFmpeg 超时从 3s 延长到 10s 并丢弃损坏片段
            - 修复音频设备 ID 用描述字符串代替导致跨调用不稳定
            - 修复 FFmpeg stdin 写入错误静默忽略，错误时停止采集

            **视频与合并**
            - 修复看门狗用总活跃时间代替分段存在时长，暂停恢复后立即误判无画面
            - 修复 BUG-04 校正对 start_ms 双重减法导致多段音频重叠、后面无声音
            - 修复两步合并 sys+mic 并存时 merge_audio_fast 无 -map 导致静默丢音源
            - 修复 resume_recording paused_total_ms 竞态膨胀（递增与相位验证在不同锁中）
            - 新增 merge_audio_segments_only 纯音频合并 → 两步流复制替代 filter_complex
            - 修复 normalize_runtime_state 丢弃 Child 进程未回收退出码
            - 修复 normalize_runtime_state 音频线程未完成时调用 reset_to_idle 泄漏线程
            - 修复 cancel_recording 不删除 output_path_final 残留文件
            - 修复 cancel_recording process.wait() 无超时改为 10s 轮询

            **资源管理**
            - 修复 resume_recording WGC/FFmpeg 创建后状态校验失败时孤儿进程/线程
            - 修复 FFmpeg stderr pipe 失败时子进程孤儿泄漏
            - 修复 stop_recording 错误路径音频临时文件泄漏
            - 修复 active_audio_process_ids 重复 COM 初始化未反初始化
            - 清理 startup + recorder 两个 cleanup 函数遗漏 _aligned.tmp.* 模式

            **前端**
            - 修复 11 个 await listen() 无 try/catch，任一失败阻断后续监听器注册
            - 修复倒计时 Escape 监听器组件卸载时泄漏，改为 AbortController
            - 修复 recording-error 将非致命错误（MIC_TOGGLE_FAILED）按 idle 处理导致按钮禁用
            - 修复 autoCollapseAfterStartPending 验证失败后未重置
            - 修复 recording-error 处理器不重置 isMicMuted
            - 修复 toggleMicState 二次校验 canToggleMic 防止向无效 session 发 IPC
            - 修复 toggleRecordingState 中 prevRawState 过期快照
            - 修复 onSystemAudioDeviceChange/onMicrophoneDeviceChange 并发无锁保护
            - 修复 systemOutputId 从不持久化（settings_model + save_app_settings 补字段）
            - 修复 refreshAllDropdownOptions 展开时被调用两次
            - 修复 syncCapsuleLayout 每次状态变更均触发（含折叠态）
            - 修复倒计时取消时 autoCollapseAfterStartPending 未重置
            - 修复 录制目标模式在倒计时期间可更改
            - 修复 窗口列表自动静默切换

            ### 🚀 性能优化

            **音频合并**
            - 跳过 AAC 文件 FFmpeg 完整解码验证（文件来自自身 pipe，100% 合法）
            - 移除 -profile:a aac_low 慢速预设，使用默认编码器
            - 流复制模式跳过无用 -b:a 参数
            - 纯音频 filter_complex + 两步流复制替代全路径 filter_complex（暂停恢复 3-6x 提速）

            ### 📋 其他模块修复

            **文档管理**
            - 修复 add_doc_category 先写 DB 再建目录，目录失败时遗留孤儿分类
            - 修复 link_import_item 静默丢弃错误
            - 修复 XLSX 共享字符串 split("<t ") 解析改为正则

            ### ✅ 全链路审查
            - 录屏 ✅ · 截图 ✅ · 文本剪贴板 ✅ · 图片剪贴板 ✅
            - 应用启动器 ✅ · 文档管理 ✅ · 设置中心 ✅ · AI 划词+OCR ✅
            - 全量 56 项修复，编译 0 错误 0 警告
          releaseDraft: false
          prerelease: false
