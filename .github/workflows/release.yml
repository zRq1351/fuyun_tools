name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - Windows 窗口录制链路升级：窗口模式接入 WGC（windows-capture），不再依赖 ffmpeg 的 gfxcapture 设备
            - 修复窗口录制停止后偶发 mp4 无法播放（moov atom not found）问题，重构 WGC 停止与封口时序
            - 区域录制交互重构：录制目标改为全屏/窗口/区域按钮，选择“区域”后可直接进入框选流程
            - 区域框选体验优化：新增确认/重选/取消图标操作，确认按钮锚定在鼠标框选结束位置
            - 区域参数展示优化：录制设置标题旁展示左上/右下坐标，框选完成后自动展开设置页便于确认
            - 录屏异常交互优化：后端异常时自动展开设置页展示错误详情，胶囊状态回到“开始录制”可直接重试
            - 异常信息可读性优化：错误信息支持完整展示与自动换行，避免在胶囊内被截断
            - 录屏稳定性增强：异常退出错误新增 stderr 关键片段回传，便于快速定位实际失败原因
            - 区域录制稳定性增强：后端新增虚拟屏幕边界裁剪与偶数尺寸对齐，修复 x264 Invalid argument 导致的退出
            - 录制中音频即时生效：支持录制过程中动态开关系统音频/麦克风，并保持时间轴连续（静音补齐）
            - 录制中音频设备兜底：开启失败时自动回退默认设备重试，并返回更具体的失败原因
            - WASAPI 兼容性提升：扩展更多采样格式支持（I8/U8/I32/U32/F64），降低“采样格式不支持”失败概率
          releaseDraft: false
          prerelease: false
