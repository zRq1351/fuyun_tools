name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 添加截图工具功能支持
            - 在设置页面添加截图快捷键配置选项
            - 实现截图工具窗口的打开和界面展示
            - 添加坐标系统转换以支持多屏幕截图
            - 集成截图快捷键的全局监听和注册
            - 优化窗口检测逻辑以支持全屏窗口选择
            - 添加截图功能的参数验证和错误处理
          releaseDraft: false
          prerelease: false
