name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 LLVM（提供 clang/libclang）
        run: choco install llvm --no-progress -y

      - name: 安装 vcpkg 并集成
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" integrate install

      - name: 安装 OpenCV（x64-windows）
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install opencv4:x64-windows-static

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: ${{ runner.temp }}\vcpkg\installed\x64-windows-static\share\opencv4
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 新增手动长截图模式：支持滚动采样后确认结束，并返回编辑工具栏继续标注/保存/复制
            - 长截图编辑增强：在长截图模式下新增缩放与平移能力，细节调整更高效
            - 拼接链路性能优化：优化拼接处理流程并引入脏标记检测，减少无效计算并提升稳定性
            - 标注状态修复：加载新图片时自动重置标注状态，避免跨图片残留
            - 图片预览体验升级：新增预览窗口拖动与缩放交互，查看大图更便捷
            - WGC 稳定性增强：新增边界配置能力探测与回退机制，降低不兼容环境下的录制失败率
          releaseDraft: false
          prerelease: false
