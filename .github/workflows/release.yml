name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install frontend dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ runner.os }}-v1
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: 安装 LLVM（提供 clang/libclang）
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: "-Clink-arg=-fuse-ld=lld"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 剪贴板全新轮播体验（v0.8.13 → v0.8.2）

            ### 🎨 剪贴板 UI 重构
            - **焦点轮播布局**：选中卡片居中放大，两侧缩放渐变
            - **连续滚动**：拖拽/惯性滑动，一次拖动能划过几十张卡片，松手吸附最近一张
            - **鼠标滚轮**：上下滚切换卡片，200ms 防抖
            - **左右箭头**：悬浮显示 ‹ › 按钮，长按连续快速翻页
            - **堆叠散开**：拖拽时卡片间距自动拉大 1.35x，不再相互遮挡
            - **精确点击**：`elementFromPoint` 穿透层叠，点击被遮挡卡片也能命中
            - **虚拟渲染**：只渲染视口附近卡片（~15/50），大幅提升性能
            - **位置感知**：卡片显示 `3/50`，一眼知道当前进度
            - **置顶强化**：黄色顶部边框 + `border-top: 2px solid var(--fy-warning)`
            - **搜索增强**：搜索模式下卡片更大（min scale 0.88）、衰减更慢
            - **空状态引导**："复制任意文本即可在此查看和管理"
            - 卡片尺寸 260×250 → 300×280

            ### 🖼️ 图片剪贴板同步升级
            - 图片剪贴板采用与文字剪贴板完全一致的轮播体验
            - 自动加载翻页：滑动到末尾自动触发下一页加载
            - 添加空状态引导文案 + Home 键跳回最新

            ### ⚡ 性能优化
            - **GPU 加速**：`translateX` 替代 `left` 定位，纯合成无重排
            - **运动优化**：拖拽期间关闭毛玻璃（`backdrop-filter`），纯色渲染无卡顿
            - **RAF 节流**：mousemove 每帧最多更新一次 `scrollPos`
            - **范围缓存**：`visibleCards` 区间不变时复用同一数组引用

            ### 🐛 修复
            - 卡片不再被上下栏截断（overflow:visible + z-index 提升）
            - 毛玻璃效果惯性结束后正确恢复
            - 悬浮不再弹出卡片遮挡其他内容
            - 吸附公式修复（不再回弹到第 0 张）
            - 图片翻页函数名修复（`loadMoreHistory` → `loadHistoryPage`）
            - 主题兼容：所有硬编码 `rgba(255,255,255,*)` 替换为 `var(--fy-*)`
          releaseDraft: false
          prerelease: false
