name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 安装 LLVM（提供 clang/libclang）
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v1
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 🎨 主题色彩修复（v0.8.12 → v0.8.13）

            ### 🐛 Bug 修复
            - **录制工具栏按钮选中态看不清**：`.target-mode-btn.active` 文字色从反色变量改为强调色变量，修复在暗色/亮色/护眼主题下文字与低透明度背景对比度不足的问题
            - **下拉菜单选中项不易辨识**：`.el-select-dropdown__item.selected` 补充选中态背景色，仅靠文字颜色变化不足以区分选中与未选中项
          releaseDraft: false
          prerelease: false
