name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install frontend dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-v2

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ runner.os }}-v1
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: 安装 LLVM（提供 clang/libclang）
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: "-C linker=lld-link"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 安全与隐私
            - AI API 密钥迁移至 Windows 凭据管理器，不再与加密数据同库存放
            - 设置界面仅显示密钥掩码，避免明文进入界面层
            - 剪贴板图片导入限制扩展名白名单，防止恶意路径写入
            - 备份解压按实际写入字节数限额，抵御恶意压缩包
            - 文档导入限制 Office XML 读取上限，避免异常文件导致卡死
            - 启动器仅允许启动可执行/快捷方式类型文件
            - 诊断日志不再记录剪贴板与选中文本全文

            ## 功能修复
            - 启动器内执行「截图」可正确打开截图编辑器
            - 截图后复制到图片剪贴板在轮询开启时也能生效
            - 图片历史重启后不再重复去重失效
            - 图片回填后正确置顶到历史最前
            - 文档 GBK/GB18030 编码文本可被正常索引与搜索
            - xlsx 共享字符串按单元格映射，搜索更准确
            - 界面语言与主题写入后端设置，重装/恢复备份后可保留
            - 启动器自定义命令「复制文本」调用正确的系统接口
            - 启动器带空格/中文路径的程序参数可正确传递

            ## 稳定性与体验
            - OCR 与 AI 非流式请求增加超时，避免界面无限等待
            - 录屏暂停后无画面时音画同步更准确
            - 录屏系统音频进程异常退出时正确清理子进程
            - 录屏停止时音频线程超时不再合并不完整文件
            - 备份恢复后立即重注册热键并同步功能开关，无需重启
            - 长截图结果写入临时目录，单帧失败不再丢失整图
            - 文档目录扫描增加深度与联接环保护
            - 配置完整性校验日志降噪，仅在真正修复时提示
            - 设置热键冲突后自动回滚，避免反复保存失败

            ## 多显示器
            - 剪贴板窗口按当前显示器工作区避开任务栏
          releaseDraft: false
          prerelease: false
