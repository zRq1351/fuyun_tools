name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 截图启动链路修复：补齐 pendingMode 启动桥接，修复冷启动偶发模式错乱
            - 截图请求竞态治理：新增会话去重与 in-flight 单飞，避免 fallback 与事件并发导致重复请求
            - 录屏 stop/cancel 重构为三段式（锁内快照 + 锁外慢清理 + 锁内收口），显著降低停止阶段锁竞争
            - WGC 音画同步增强：前置统一录制时钟 + 首帧锚点校正，修复窗口录制音频滞后问题
            - 新增“窗口录制音频同步补偿(ms)”设置项（仅窗口录制生效），支持按机器环境细调
            - 录制结束稳态增强：加入“重命名重试 + 退避 + 合成前视频校验重试”，提升杀软/占用场景成功率
            - 修复“录制完成自动打开目录”未触发问题，并将该选项默认改为关闭
            - 录屏胶囊“捕获工具栏”语义修正：与后端 content_protected 字段完成反向映射
            - 设置入口去重：保留系统托盘“设置”入口，清理设置中心与录屏胶囊重复录屏项
            - 工程稳态改进：历史快照改增量 Upsert、录屏命令迁移 spawn_blocking、快捷键监听卸载兜底、预览锁调用与录屏快捷键防抖门闩优化
          releaseDraft: false
          prerelease: false
