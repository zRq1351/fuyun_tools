name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Cache npm
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: src/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: install frontend dependencies
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        id: cache-rust
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-v2

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-${{ runner.os }}-v1
          restore-keys: |
            llvm-${{ runner.os }}-

      - name: 安装 LLVM（提供 clang/libclang）
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: choco install llvm --no-progress -y

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: D:\vcpkg
          key: vcpkg-opencv-${{ runner.os }}-static-md-v2
          restore-keys: |
            vcpkg-opencv-${{ runner.os }}-static-md

      - name: 安装 vcpkg 并集成
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git D:\vcpkg
          & D:\vcpkg\bootstrap-vcpkg.bat
          & D:\vcpkg\vcpkg.exe integrate install

      - name: 安装 OpenCV（x64-windows）
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & D:\vcpkg\vcpkg.exe install opencv4:x64-windows-static-md

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTFLAGS: "-C linker=lld-link"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VCPKG_ROOT: D:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
          VCPKGRS_DYNAMIC: "0"
          OpenCV_DIR: D:\vcpkg\installed\x64-windows-static-md\share\opencv4
          OPENCV_MSVC_CRT: dynamic
          OPENCV_DISABLE_PROBES: environment,cmake,vcpkg_cmake,pkg_config
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          CLANG_PATH: C:\Program Files\LLVM\bin\clang.exe
        with:
          args: --features longshot-opencv
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本版亮点
            - **AI 划词体验**：魔法棒贴齐划词结束点、减少闪烁；悬停展开 / 移开收起；弹出静默期后若光标仍在棒上会自动展开
            - **截图标注增强**：荧光笔高亮、遮挡黑条、编辑器内裁剪到选区（修复 asset 源图无法导出）；Shift 约束几何
            - **文档管理**：Ctrl/Shift 多选批量打标；标签改名/删除；搜索标签筛选、摘要高亮；可重建全文索引
            - **性能与可测性**：图片分页路径可用时不下发冗余 preview；前端测试补强；清理死代码

            ## AI 划词
            - 魔法棒默认出现在划词结束点附近（偏移加大，避开选区末尾）
            - 划词后短静默，避免与光标重叠时反复闪动
            - 悬停魔法棒展开完整工具栏；鼠标移开立即收起
            - 展开时窗口顶点不跳动；假 leave / 失焦抖动不再误收起
            - 后端：去重时不重复 show；仅用单通道更新文案

            ## 截图与标注
            - 荧光笔：半透明粗笔刷高亮文字，预览与导出一致
            - 遮挡黑条：拖拽压黑敏感信息，可移动/缩放，导出强制填充
            - 裁剪到选区：选区 + 标注烘焙为新底图；后端渲染避免 tainted canvas 导出失败
            - Shift 约束：矩形/黑条→正方形；圆→正圆外接；直线/箭头吸附 0°/45°/90°

            ## 文档管理
            - 文件列表多选后批量添加/移除/替换标签
            - 标签管理：全局重命名（合并语义）、删除，同步全文检索
            - 搜索：按标签 AND 筛选；关键词摘要（中文安全）与命中高亮
            - 设置入口：重建文档全文索引

            ## 优化与清理
            - 图片剪贴板分页 IPC 减负（有本地路径时跳过 base64 预览）
            - 前端 vitest 覆盖截图标注/格式化/诊断状态等纯逻辑
            - 移除未使用的剪贴板全量快照接口与 adaptive_poll 死代码
            - README / README_EN 按当前功能重写
          releaseDraft: false
          prerelease: false
