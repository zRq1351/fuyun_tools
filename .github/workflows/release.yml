name: '发布应用'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: npm install
        working-directory: src

      - name: build frontend
        run: npm run build
        working-directory: src

      - name: disable beforeBuildCommand
        shell: bash
        run: |
          sed -i 's/"beforeBuildCommand": "npm run build"/"beforeBuildCommand": ""/' src-tauri/tauri.conf.json

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 构建并发布 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            ## 本次更新
            - 修复图片页在大数据量场景下重载卡顿问题，重载流程改为分页增量同步优先
            - 优化图片筛选性能：新增查询签名缓存，减少重复全量计算
            - 新增标签与分类倒排索引，关键词检索改为集合命中判断，降低逐项扫描开销
            - 优化图片处理队列：从单消费者升级为多 worker 并行消费，提升高频输入吞吐
            - 改进队列通知模型与背压可观测性，新增高水位、丢弃、等待时延等指标
            - 修复持久化队列满时阻塞发送问题，改为限时重试与超时降级策略
            - 开发者面板新增图片持久化队列监控，支持容量/超时/丢弃/等待等实时观察
            - 优化回填链路等待策略，减少固定 sleep 叠加导致的尾延迟抖动
            - 前后端继续保持开发与生产硬隔离，调试能力仅在开发构建可见
          releaseDraft: false
          prerelease: false
