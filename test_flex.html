<!DOCTYPE html>
<html>
<head>
<style>
.content {
  display: flex;
  overflow-x: auto;
  width: 1000px;
  border: 1px solid black;
}
.virtual-wrapper {
  display: flex;
  height: 100%;
}
.item {
  width: 250px;
  margin-right: 8px;
  flex-shrink: 0;
  border: 1px solid red;
  box-sizing: border-box;
}
</style>
</head>
<body>
<div class="content" id="content">
  <div class="virtual-wrapper" id="wrapper" style="width: 3612px; margin-left: 9288px;">
    <!-- 24 items -->
  </div>
</div>
<script>
  const wrapper = document.getElementById('wrapper');
  for(let i=0; i<24; i++) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerText = i;
    wrapper.appendChild(div);
  }
  console.log("Wrapper width:", wrapper.getBoundingClientRect().width);
  console.log("Content scrollWidth:", document.getElementById('content').scrollWidth);
</script>
</body>
</html>
