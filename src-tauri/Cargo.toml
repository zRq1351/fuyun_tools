[package]
name = "fuyun_tools"
version = "0.6.9"
authors = ["zrq"]
edition = "2021"

[lib]
name = "fuyun_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-positioner = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.29"
regex = "1.11.1"
async-openai = { version = "0.34.0", default-features = false, features = ["chat-completion", "rustls"] }
futures-util = "0.3.31"
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["windows-native"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
imageproc = { version = "0.25.0", default-features = false }
ab_glyph = "0.2.29"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
lru = "0.16.3"
parking_lot = "0.12.5"
bloom = "0.3.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
screenshots = "0.8.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10.9"
windows-capture = "2.0.0-alpha.7"
opencv = { version = "0.98.2", optional = true, default-features = false, features = ["clang-runtime", "imgproc"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.52.1", features = ["sync"] }
chrono = "0.4"
lazy_static = "1.4.0"
scopeguard = "1.2.0"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
ocr-rs = { version = "2.2.2", features = ["build-mnn-from-source"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = []
longshot-opencv = ["dep:opencv"]

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "winnt", "minwindef", "windef", "libloaderapi", "winbase", "processthreadsapi", "handleapi", "tlhelp32", "shellapi", "dwmapi", "jobapi2", "wingdi"] }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }
cpal = "0.17.3"
hound = "3.5.1"
wasapi = "0.23.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
dirs = "5.0.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["x11rb"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
