[package]
name = "fuyun_tools"
version = "0.6.0"
authors = ["zrq"]
edition = "2021"

[lib]
name = "fuyun_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-positioner = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.29"
regex = "1.11.1"
async-openai = { version = "0.34.0", features = ["chat-completion"] }
futures-util = "0.3.31"
base64 = "0.22.1"
keyring = { version = "3.6.3", features = ["windows-native"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
lru = "0.16.3"
parking_lot = "0.12.5"
bloom = "0.3.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
screenshots = "0.8.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "winnt", "minwindef", "windef", "libloaderapi", "winbase", "processthreadsapi", "windowsx", "errhandlingapi", "handleapi", "heapapi", "memoryapi", "psapi", "synchapi", "sysinfoapi", "timezoneapi", "tlhelp32", "winioctl", "wingdi", "winerror", "winnls", "winreg", "winsvc", "setupapi", "ioapiset", "fileapi", "consoleapi", "namedpipeapi", "processenv", "stringapiset", "profileapi", "libloaderapi", "dwmapi", "shellapi"] }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
cpal = "0.17.3"
hound = "3.5.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
enigo = { version = "0.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", features = ["x11rb"] }
