<!DOCTYPE html>
<html>
<head>
<style>
.content {
  display: flex;
  flex-direction: row;
  width: 800px;
  overflow-x: auto;
  border: 1px solid black;
  padding: 8px;
}
.virtual-wrapper {
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  height: 100%;
}
.item {
  width: 250px;
  margin-right: 8px;
  background: rgba(0, 0, 0, 0.6);
  flex-shrink: 0;
  border: 1px solid red;
  box-sizing: border-box;
}
.tail {
  flex-shrink: 0;
  width: 56px;
  background: red;
}
</style>
</head>
<body>
<div class="content" id="c">
  <div class="virtual-wrapper" id="v" style="width: 2838px; margin-left: 10062px;">
     <div class="item">39</div>
     <div class="item">40</div>
     <div class="item">41</div>
     <div class="item">42</div>
     <div class="item">43</div>
     <div class="item">44</div>
     <div class="item">45</div>
     <div class="item">46</div>
     <div class="item">47</div>
     <div class="item">48</div>
     <div class="item">49</div>
  </div>
  <div class="tail">Tail</div>
</div>
<script>
setTimeout(() => {
  const c = document.getElementById('c');
  const v = document.getElementById('v');
  console.log('ScrollLeft:', c.scrollLeft, 'ScrollWidth:', c.scrollWidth);
  c.scrollLeft = 100000;
  console.log('ScrollLeft:', c.scrollLeft, 'ScrollWidth:', c.scrollWidth);
  console.log('Wrapper width:', v.offsetWidth, 'margin-left:', v.style.marginLeft);
  console.log('Total content inner width:', 8 + parseInt(v.style.marginLeft) + v.offsetWidth + 56 + 8);
}, 100);
</script>
</body>
</html>
