<!DOCTYPE html>
<html>
<head>
<style>
.content {
  display: flex;
  flex-direction: row;
  width: 800px;
  overflow-x: auto;
  border: 1px solid black;
  padding: 8px;
}
.virtual-wrapper {
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  height: 100%;
}
.item {
  width: 250px;
  margin-right: 8px;
  background: rgba(0, 0, 0, 0.6);
  flex-shrink: 0;
  border: 1px solid red;
  box-sizing: border-box;
}
.tail {
  flex-shrink: 0;
  width: 56px;
  background: red;
}
</style>
</head>
<body>
<div class="content" id="c">
  <div class="virtual-wrapper" id="v" style="width: 2580px; margin-left: 10320px;">
     <div class="item">40</div>
     <div class="item">41</div>
     <div class="item">42</div>
     <div class="item">43</div>
     <div class="item">44</div>
     <div class="item">45</div>
     <div class="item">46</div>
     <div class="item">47</div>
     <div class="item">48</div>
     <div class="item" id="item49">49</div>
  </div>
  <div class="tail">Tail</div>
</div>
<script>
setTimeout(() => {
  const c = document.getElementById('c');
  const v = document.getElementById('v');
  console.log('ScrollWidth:', c.scrollWidth, 'Virtual Wrapper calculated:', 10320 + 2580, 'Expected:', 50 * 258);
  c.scrollLeft = 100000;
  const item49 = document.getElementById('item49');
  console.log('Item 49 offsetLeft:', item49.offsetLeft, 'c.scrollLeft:', c.scrollLeft);
}, 100);
</script>
</body>
</html>
