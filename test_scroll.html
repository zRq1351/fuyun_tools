<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; }
  .content {
    width: 1000px;
    height: 300px;
    overflow-x: auto;
    background: #eee;
    display: flex;
    flex-direction: row;
    padding: 8px;
  }
  .virtual-wrapper {
    display: flex;
    flex-direction: row;
    height: 100%;
    flex-shrink: 0;
    box-sizing: border-box;
    /* Simulate visibleHistory.length * 258 = 21 * 258 = 5418 */
    width: 5418px;
    /* Simulate start=7, paddingLeft = 7 * 258 = 1806 */
    padding-left: 1806px;
    background: #ccc;
  }
  .item {
    width: 250px;
    margin-right: 8px;
    flex-shrink: 0;
    height: 100px;
    background: red;
    border: 1px solid black;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="content" id="content">
    <div class="virtual-wrapper">
      <!-- Simulate 14 items (from index 7 to 20) -->
      <script>
        for (let i = 7; i <= 20; i++) {
          document.write(`<div class="item">Item ${i+1}</div>`);
        }
      </script>
    </div>
  </div>
  <script>
    const content = document.getElementById('content');
    content.scrollLeft = 4418;
    console.log("scrollLeft:", content.scrollLeft, "scrollWidth:", content.scrollWidth);
  </script>
</body>
</html>
