<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/@vueuse/shared"></script>
  <script src="https://unpkg.com/@vueuse/core"></script>
  <style>
    body { margin: 0; padding: 20px; }
    .content {
      width: 800px;
      height: 200px;
      border: 1px solid black;
      display: flex;
      flex-direction: row;
      overflow-x: auto;
      padding: 8px;
    }
    .virtual-wrapper {
      display: flex;
      flex-direction: row;
      height: 100%;
      flex-shrink: 0;
    }
    .clipboard-item {
      width: 250px;
      margin-right: 8px;
      flex-shrink: 0;
      background: #ccc;
      border: 1px solid red;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div
      v-bind="containerProps"
      class="content"
    >
      <div
        class="virtual-wrapper"
        :style="{
          width: (list.length ? 21 * 258 : 0) + 'px',
          paddingLeft: wrapperProps.style?.marginLeft || '0px',
          boxSizing: 'border-box'
        }"
      >
        <div
          v-for="virtualRow in list"
          :key="virtualRow.index"
          class="clipboard-item"
        >
          {{ virtualRow.data }}
        </div>
      </div>
    </div>
  </div>
  <script>
    const { createApp, ref } = Vue;
    const { useVirtualList } = VueUse;

    createApp({
      setup() {
        const items = ref(Array.from({ length: 21 }, (_, i) => i + 1));
        const { list, containerProps, wrapperProps } = useVirtualList(items, {
          itemWidth: 258,
          overscan: 10
        });
        
        return { list, containerProps, wrapperProps, items };
      }
    }).mount('#app');
  </script>
</body>
</html>
