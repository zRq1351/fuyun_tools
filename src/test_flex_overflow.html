<!DOCTYPE html>
<html>
<head>
  <style>
    .content {
      width: 400px;
      height: 100px;
      overflow-x: auto;
      display: flex;
      border: 1px solid black;
    }
    .wrapper {
      width: 500px;
      height: 50px;
      background: rgba(255,0,0,0.2);
      flex-shrink: 0;
    }
    .item {
      width: 600px;
      height: 30px;
      background: rgba(0,255,0,0.5);
    }
  </style>
</head>
<body>
  <div class="content" id="content">
    <div class="wrapper">
      <div class="item"></div>
    </div>
  </div>
  <script>
    const content = document.getElementById('content');
    console.log('scrollWidth:', content.scrollWidth);
    document.write('scrollWidth: ' + content.scrollWidth);
  </script>
</body>
</html>
