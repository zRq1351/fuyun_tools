<!DOCTYPE html>
<html>
<head>
<style>
.content {
  display: flex;
  flex-direction: row;
  width: 800px;
  overflow-x: auto;
  border: 1px solid black;
  padding: 8px;
}
.virtual-wrapper {
  flex-shrink: 0;
  display: flex;
  flex-direction: row;
  height: 100%;
}
.item {
  width: 250px;
  margin-right: 8px;
  background: rgba(0, 0, 0, 0.6);
  flex-shrink: 0;
  border: 1px solid red;
  box-sizing: border-box;
}
</style>
</head>
<body>
<div class="content" id="c">
  <div class="virtual-wrapper" id="v" style="width: 2580px; margin-left: 10320px;">
     <div class="item">40</div>
     <div class="item">41</div>
     <div class="item">42</div>
     <div class="item">43</div>
     <div class="item">44</div>
     <div class="item">45</div>
     <div class="item">46</div>
     <div class="item">47</div>
     <div class="item">48</div>
     <div class="item" id="item49">49</div>
  </div>
</div>
<script>
setTimeout(() => {
  const c = document.getElementById('c');
  c.scrollLeft = 100000;
  const maxScrollLeft = c.scrollWidth - c.clientWidth;
  console.log('ScrollWidth:', c.scrollWidth, 'maxScrollLeft:', maxScrollLeft);
  console.log('Item 49 offsetLeft:', document.getElementById('item49').offsetLeft);
  console.log('Is item 49 visible?', maxScrollLeft + 800 > document.getElementById('item49').offsetLeft + 258);
}, 100);
</script>
</body>
</html>
