<!DOCTYPE html>
<html>
<head>
<style>
.content {
  display: flex;
  overflow-x: auto;
  width: 500px;
  border: 1px solid black;
}
.virtual-wrapper {
  display: flex;
  width: 5000px;
  /* flex-shrink: 1; */
  background: lightblue;
}
.item {
  width: 250px;
  flex-shrink: 0;
  border: 1px solid red;
}
</style>
</head>
<body>
<div class="content">
  <div class="virtual-wrapper" id="wrapper">
    <!-- add 10 items, total width 2500px -->
    <div class="item">1</div><div class="item">2</div><div class="item">3</div>
    <div class="item">4</div><div class="item">5</div><div class="item">6</div>
    <div class="item">7</div><div class="item">8</div><div class="item">9</div>
    <div class="item">10</div>
  </div>
</div>
<script>
  console.log("Wrapper width:", document.getElementById('wrapper').getBoundingClientRect().width);
  console.log("Content scrollWidth:", document.querySelector('.content').scrollWidth);
</script>
</body>
</html>
